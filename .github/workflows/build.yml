name: Build FINANCIIEA APK

# This robot (GitHub Actions) builds the Android app automatically
# every time you push (upload) new code to the main branch.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the app (debug APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FINANCIIEA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
